<h1>함께지음 사용 가이드</h1>
<p>처음 쓰는 분을 위해 화면마다 어디를 누르면 되는지 정리했어요. 화면은 예시 데이터로 찍었어요.</p>
<nav><ol>
<li><a href="#s1">처음 시작</a></li>
<li><a href="#s2">돌봄 기록·기도제목</a></li>
<li><a href="#s3">모임·출석·보고서</a></li>
<li><a href="#s4">백업·기기 옮기기</a></li>
</ol></nav>
<h2 id="s1">1. 처음 시작</h2>
<img src="cards/01_create_space.png" width="1080" height="2340" loading="lazy" alt="먼저 공간을 만들어요. 공간은 내가 돌보는 모임 하나예요. 순, 사역팀, 부서처럼 모임마다 따로 만들 수 있어요.">
<img src="cards/02_space_form.png" width="1080" height="2340" loading="lazy" alt="이름과 유형을 고르면 끝. 유형에 따라 순원·팀원처럼 앱 안의 말이 바뀌어요. 처음이면 &#x27;예시 내용 채우기&#x27;를 켜고 연습해 보세요.">
<img src="cards/03_add_member.png" width="1080" height="2340" loading="lazy" alt="순원을 추가해요. 아래 &#x27;순원&#x27; 탭에서 오른쪽 위 + 를 눌러요.">
<img src="cards/04_member_form.png" width="1080" height="2340" loading="lazy" alt="이름만 있어도 돼요. 연락처와 생일은 아는 만큼만 넣어요. 생일을 넣으면 생일 알림이 와요.">
<h2 id="s2">2. 돌봄 기록·기도제목</h2>
<img src="cards/05_care_record.png" width="1080" height="2340" loading="lazy" alt="연락하거나 만난 일을 남겨요. 순원을 누르고 &#x27;돌봄 기록&#x27;을 눌러요.">
<img src="cards/06_follow_up.png" width="1080" height="2340" loading="lazy" alt="다음에 물어볼 것을 적어 두세요. 확인 예정일까지 고르면 그날 알림이 와요. 다음 연락 때 잊지 않고 안부를 이어 갈 수 있어요.">
<img src="cards/07_prayer.png" width="1080" height="2340" loading="lazy" alt="기도제목도 순원별로. &#x27;기도제목&#x27;을 눌러 적어요. 응답되면 상태를 &#x27;응답됨&#x27;으로 바꿔 두면 함께 감사할 수 있어요.">
<img src="cards/08_home.png" width="1080" height="2340" loading="lazy" alt="오늘 챙길 것은 홈에서. 확인할 날이 된 일과 다가오는 생일이 홈에 모여요. 앱을 열면 여기부터 보면 돼요.">
<h2 id="s3">3. 모임·출석·보고서</h2>
<img src="cards/09_add_meeting.png" width="1080" height="2340" loading="lazy" alt="모임을 마치면 순모임 추가. 아래 &#x27;순모임&#x27; 탭에서 + 를 눌러 날짜와 말씀을 적고 &#x27;저장하고 순원 기록&#x27;을 눌러요.">
<img src="cards/10_attendance.png" width="1080" height="2340" loading="lazy" alt="순원마다 출석과 나눔을 적어요. 출석을 고르고, 순원을 누르면 그날 나눈 이야기를 남길 수 있어요. 다 적었으면 &#x27;기록 완료&#x27;.">
<img src="cards/11_calendar.png" width="1080" height="2340" loading="lazy" alt="심방 약속은 달력에. &#x27;순모임&#x27; 탭의 &#x27;달력&#x27;에서 날짜를 눌러 심방 예정을 잡아 두세요.">
<img src="cards/12_report.png" width="1080" height="2340" loading="lazy" alt="보고서는 PDF로 한 번에. &#x27;설정&#x27;에서 순모임 보고서나 기도제목을 PDF로 만들어 간사님께 보내거나 순원들과 나눠요.">
<img src="cards/13_report_pick.png" width="1080" height="2340" loading="lazy" alt="넣을 내용만 골라요. 주를 옮겨 고르고, 빼고 싶은 항목은 체크를 풀어요. 체크를 푼 내용은 PDF에 들어가지 않아요.">
<h2 id="s4">4. 백업·기기 옮기기</h2>
<img src="cards/14_backup.png" width="1080" height="2340" loading="lazy" alt="기록은 내 폰에만 있어요. 서버에 따로 저장되지 않아요. 폰을 잃어버리면 기록도 사라지니 가끔 백업해 두세요.">
<img src="cards/15_backup_export.png" width="1080" height="2340" loading="lazy" alt="백업 파일을 내보내요. &#x27;비밀번호로 잠그기&#x27;를 고르면 파일을 열 때 비밀번호가 필요해요. 카톡 나와의 채팅이나 드라이브에 보관하세요.">
<img src="cards/16_backup_restore.png" width="1080" height="2340" loading="lazy" alt="새 폰에서는 가져오기. 새 폰에 앱을 깔고 설정 → 백업 및 복원 → &#x27;백업 파일 가져오기&#x27;. 그 폰에 있던 기록은 백업 내용으로 바뀌어요.">
<p>더 궁금한 점은 <a href="mailto:wnshroqkf@naver.com">wnshroqkf@naver.com</a> 으로 물어봐 주세요.</p>
</main></body>
